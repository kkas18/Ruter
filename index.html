<!-- ===== Kart: hovedflaten ===== -->
<main id="app">
  <div id="map"></div>
  <div class="map-scrim" aria-hidden="true"></div>

  <div class="topbar" id="topbar">
    <button class="search-bar press" id="searchBar" type="button">
      <svg class="g" aria-hidden="true"><use href="#i-search"/></svg><span data-t>Hvor vil du?</span>
    </button>
    <div class="net-chip" id="netChip" role="status" hidden>Frakoblet</div>
    <button class="round press" id="menuBtn" type="button" aria-label="Innstillinger" data-t-attr="aria-label"><svg class="g" aria-hidden="true"><use href="#i-gear"/></svg></button>
  </div>

  <div class="map-ctrl" id="mapCtrl">
    <button class="round press" id="compassBtn" type="button" aria-label="Pek mot nord" data-t-attr="aria-label" hidden><svg class="g" id="compassIcon" aria-hidden="true"><use href="#i-north"/></svg></button>
    <button class="round press" id="layerBtn" type="button" aria-label="Vis satellitt" aria-pressed="false"><svg class="g" aria-hidden="true"><use href="#i-layers"/></svg></button>
    <button class="round press" id="locateBtn" type="button" aria-label="Vis posisjonen min" data-t-attr="aria-label" aria-pressed="false"><svg class="g" aria-hidden="true"><use href="#i-locate"/></svg></button>
  </div>

  <!-- Arket: én stabel med sider i stedet for faner -->
  <section class="sheet" id="sheet">
    <div class="sheet-handle" id="sheetHandle" role="button" tabindex="0" aria-label="Endre høyden på panelet" data-t-attr="aria-label"><span></span></div>
    <header class="sheet-head" id="sheetHead"></header>
    <div class="sheet-scroll" id="sheetScroll" tabindex="0" role="region" aria-label="Innhold" data-t-attr="aria-label"><div class="ptr" id="ptr" aria-hidden="true"><i class="ptr-road"></i><svg class="ptr-bus" viewBox="0 0 28 18"><use href="#i-bus"/></svg></div><div class="sheet-page" id="sheetPage"></div></div>
  </section>
</main>

<div class="setup-notice" id="setupNotice" hidden>
  <b data-t>Appen er åpnet direkte fra en mappe.</b><br>
  <span data-t>Reisesøk og posisjon krever at appen åpnes fra en HTTPS-adresse.</span>
</div>
